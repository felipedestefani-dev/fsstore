<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — Controler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-screen">
    <div class="auth-box">
      <div class="auth-brand">
        <img class="auth-brand__logo" src="logo.svg" alt="" width="48" height="48" />
        <span class="auth-brand__name">Controler</span>
      </div>
      <h1 class="auth-box__title">Criar conta</h1>
      <p class="auth-box__subtitle">Cadastre-se para acompanhar seu progresso</p>

      <form class="auth-form" id="form-register">
        <label class="form__field">
          <span>E-mail</span>
          <input type="email" id="register-email" placeholder="seu@email.com" required />
        </label>
        <label class="form__field">
          <span>Senha</span>
          <input type="password" id="register-senha" placeholder="Mín. 6 caracteres" minlength="6" required />
        </label>
        <label class="form__field">
          <span>Confirmar senha</span>
          <input type="password" id="register-senha2" placeholder="Repita a senha" required />
        </label>
        <p class="auth-error" id="register-error" hidden></p>
        <button type="submit" class="btn btn--primary btn--block">Criar conta</button>
      </form>

      <p class="auth-link">
        Já tem conta? <a href="login.html">Entrar</a>
      </p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    (function () {
      if (window.getCurrentUser && getCurrentUser()) {
        window.location.href = 'index.html';
        return;
      }
      var form = document.getElementById('form-register');
      var registerError = document.getElementById('register-error');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = document.getElementById('register-email').value;
        var senha = document.getElementById('register-senha').value;
        var senha2 = document.getElementById('register-senha2').value;
        if (registerError) registerError.hidden = true;
        if (senha !== senha2) {
          registerError.textContent = 'As senhas não coincidem.';
          registerError.hidden = false;
          return;
        }
        if (senha.length < 6) {
          registerError.textContent = 'A senha deve ter no mínimo 6 caracteres.';
          registerError.hidden = false;
          return;
        }
        if (!email) return;
        register(email, senha).then(function (ok) {
          if (ok) window.location.href = 'index.html';
          else {
            registerError.textContent = 'Este e-mail já está cadastrado.';
            registerError.hidden = false;
          }
        });
      });
    })();
  </script>
</body>
</html>
