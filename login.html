<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Controler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-screen">
    <div class="auth-box">
      <div class="auth-brand">
        <img class="auth-brand__logo" src="logo.svg" alt="" width="48" height="48" />
        <span class="auth-brand__name">Controler</span>
      </div>
      <h1 class="auth-box__title">Entrar</h1>
      <p class="auth-box__subtitle">Use seu e-mail para acessar sua conta</p>

      <form class="auth-form" id="form-login">
        <label class="form__field">
          <span>E-mail</span>
          <input type="email" id="login-email" placeholder="seu@email.com" required />
        </label>
        <label class="form__field">
          <span>Senha</span>
          <input type="password" id="login-senha" placeholder="••••••••" required />
        </label>
        <p class="auth-error" id="login-error" hidden></p>
        <button type="submit" class="btn btn--primary btn--block">Entrar</button>
      </form>

      <p class="auth-link">
        Não tem conta? <a href="criar-conta.html">Criar conta</a>
      </p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    (function () {
      if (window.getCurrentUser && getCurrentUser()) {
        window.location.href = 'index.html';
        return;
      }
      var form = document.getElementById('form-login');
      var loginError = document.getElementById('login-error');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = document.getElementById('login-email').value;
        var senha = document.getElementById('login-senha').value;
        if (!email || !senha) return;
        if (loginError) loginError.hidden = true;
        login(email, senha).then(function (ok) {
          if (ok) window.location.href = 'index.html';
          else {
            if (loginError) {
              loginError.textContent = 'E-mail ou senha incorretos.';
              loginError.hidden = false;
            }
          }
        });
      });
    })();
  </script>
</body>
</html>
